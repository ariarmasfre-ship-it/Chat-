<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ef"><title>chicuelos 😁🦦</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--ink:#232720;--muted:#878a7d;--paper:#f7f6f1;--white:#fff;--line:#e8e7df;--accent:#d7fb66;--mine:#26362d;--other:#fff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e9e9e1;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:100%;height:100vh;height:100dvh;min-height:300px;max-width:860px;margin:auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;position:relative}.top{background:rgba(247,246,241,.97);padding:16px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;z-index:1}.logo{height:43px;width:43px;display:grid;place-items:center;background:var(--accent);border-radius:15px;font-size:24px;transform:rotate(-5deg)}.title{font-size:23px;letter-spacing:-1.1px;line-height:1.1;font-weight:850}.sub{color:var(--muted);font-size:11px;letter-spacing:.03em;margin-top:5px}.online{margin-left:auto;font-size:11px;color:#657263;white-space:nowrap;display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;background:#8bbf4e;border-radius:50%}.chat{flex:1;overflow:auto;overscroll-behavior:contain;padding:22px 19px 20px;display:flex;flex-direction:column;gap:11px;background-image:radial-gradient(#dcded5 0.65px,transparent .65px);background-size:19px 19px}.date{align-self:center;background:#eeeee6;border:1px solid #e5e5dc;border-radius:99px;color:#84867d;font-size:10px;padding:7px 12px;margin:2px 0 13px;letter-spacing:.08em;text-transform:uppercase}.bubble{max-width:min(82%,440px);align-self:flex-start;background:var(--other);border:1px solid #ecebe5;border-radius:19px 19px 19px 6px;padding:12px 15px 9px;box-shadow:0 4px 14px #272d2008;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:var(--mine);border-color:var(--mine);color:#fff;border-radius:19px 19px 6px 19px}.who{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#83907b;margin-bottom:5px}.mine .who{color:#d7fb66}.content{font-size:14px;line-height:1.5;white-space:pre-wrap}.time{font-size:9px;text-align:right;opacity:.53;margin-top:7px}.empty{margin:auto;text-align:center;max-width:290px}.empty .symbol{font-size:46px}.empty h2{font-size:24px;letter-spacing:-1px;margin:12px 0 6px}.empty p{color:#8c8d83;font-size:13px;line-height:1.5}.composer{background:var(--paper);border-top:1px solid var(--line);padding:13px 17px calc(13px + env(safe-area-inset-bottom));display:flex;align-items:end;gap:10px}.name-wrap{width:95px;flex-shrink:0}.name-wrap label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 5px 7px;font-weight:700}#name{width:100%;height:43px;border-radius:13px;border:1px solid #e4e5dc;padding:0 10px;background:#fff;outline:0;font-size:12px}#message{resize:none;flex:1;min-width:0;max-height:140px;height:43px;border-radius:14px;border:1px solid #e4e5dc;padding:12px 13px;background:#fff;outline:0;font-size:13px}#name:focus,#message:focus{border-color:#8aab4b}#send{height:43px;width:43px;border-radius:14px;border:0;background:var(--accent);color:#26362d;display:grid;place-items:center;flex-shrink:0}#send:disabled{opacity:.4}#send svg{height:19px;width:19px}.alert{padding:8px 18px;background:#ffe8df;color:#9e432d;font-size:12px}.footer{font-size:10px;color:#999a8e;text-align:center;padding:0 10px 5px;background:var(--paper)}@media(min-width:600px){.shell{border-left:1px solid #dadbd0;border-right:1px solid #dadbd0}.chat{padding:28px 42px}.composer{padding-left:30px;padding-right:30px}}@media(max-width:350px){.top{padding:12px}.title{font-size:20px}.online{font-size:9px}.composer{padding-left:8px;padding-right:8px;gap:6px}.name-wrap{width:75px}}
</style><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script></head><body><div class="shell"><header class="top"><div class="logo">🦦</div><div><div class="title">chicuelos <span style="font-size:17px">😁</span></div><div class="sub">your own little universe, just here.</div></div><div class="online"><span class="dot" id="dot"></span><span id="status">connecting</span></div></header><div id="error" class="alert" hidden role="alert"></div><main id="chat" class="chat" aria-live="polite"><div class="empty"><div class="symbol">✳</div><h2>the good stuff happens here.</h2><p>Say something to your favorite person.</p></div></main><form id="form" class="composer"><div class="name-wrap"><label for="name">your name</label><input id="name" placeholder="nickname" maxlength="30" required autocomplete="nickname"></div><textarea id="message" placeholder="say something..." maxlength="1500" required rows="1" aria-label="Message"></textarea><button id="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button></form><div class="footer">chicuelos © your little corner of the internet · <span id="install-help"><button id="enable-notifications" type="button" style="border:0;background:none;color:#526c26;text-decoration:underline;padding:0;font-size:inherit">Enable notifications</button></span></div></div>
<script>
'use strict';
// Publishable client-side key only. Do not use service_role keys in a website.
const SUPABASE_URL='https://ofqmlfgofuchpkncqcex.supabase.co';
const SUPABASE_KEY='sb_publishable_1UE_J6LkBqaZ0OosLcs-xw_FbPzCY7P';
const TABLE='notion_link_chat';
const $=id=>document.getElementById(id),chat=$('chat');
let lastSignature='',fetching=false,sending=false,firstLoad=true;
try{$('name').value=localStorage.getItem('chicuelos-name')||''}catch(_){}
$('name').addEventListener('input',()=>{try{localStorage.setItem('chicuelos-name',$('name').value.trim())}catch(_){};lastSignature=''});
function setError(s){$('error').hidden=!s;$('error').textContent=s||''}
async function query(path,opts={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,...(opts.body?{'Content-Type':'application/json','Prefer':'return=minimal'}:{})},cache:'no-store'});if(!r.ok){let detail=(await r.text()).slice(0,160);throw new Error(r.status+' '+detail)}return opts.body?null:r.json()}
function render(rows){const sig=rows.map(r=>r.id+':'+r.sender).join('|')+':'+$('name').value.trim();if(sig===lastSignature)return;lastSignature=sig;const nearBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<110;const frag=document.createDocumentFragment();if(!rows.length){let empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div class="symbol">✳</div><h2>the good stuff happens here.</h2><p>Say something to your favorite person.</p>';frag.append(empty)}else{let date=document.createElement('div');date.className='date';date.textContent='the conversation';frag.append(date);for(const m of rows){const mine=m.sender===$('name').value.trim();let b=document.createElement('article');b.className='bubble'+(mine?' mine':'');let who=document.createElement('div');who.className='who';who.textContent=m.sender;let body=document.createElement('div');body.className='content';body.textContent=m.content;let time=document.createElement('div');time.className='time';time.textContent=new Date(m.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});b.append(who,body,time);frag.append(b)}}chat.replaceChildren(frag);if(nearBottom||firstLoad)chat.scrollTop=chat.scrollHeight;firstLoad=false}
async function refresh(){if(fetching)return;fetching=true;try{const rows=await query(TABLE+'?select=id,sender,content,created_at&order=created_at.desc&limit=200');render(rows.reverse());$('status').textContent='live';$('dot').style.background='#8bbf4e';setError('')}catch(e){$('status').textContent='offline';$('dot').style.background='#d87560';setError(e.message.includes('404')||e.message.includes('42P01')?'Chat table not set up yet. Run setup.sql in Supabase SQL Editor.':'Connection problem: '+e.message)}finally{fetching=false}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(sending)return;const sender=$('name').value.trim(),content=$('message').value.trim();if(!sender||!content)return;sending=true;$('send').disabled=true;try{await query(TABLE,{method:'POST',body:JSON.stringify({sender,content})});$('message').value='';try{localStorage.setItem('chicuelos-name',sender)}catch(_){}await refresh()}catch(err){setError('Could not send: '+err.message)}finally{sending=false;$('send').disabled=false;$('message').focus()}});
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
// OneSignal needs its own service worker at the GitHub Pages project path.
// Do not register sw.js at the same scope: that would replace OneSignal's worker.
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  const base = new URL('./', window.location.href).pathname;
  try {
    await OneSignal.init({
      appId: '7b1e0a38-f83b-414d-b827-b6e4a8acf8d8',
      safari_web_id: 'web.onesignal.auto.4a2f472e-2de1-469e-8f55-0b3384f6ae6c',
      serviceWorkerPath: base + 'OneSignalSDKWorker.js',
      serviceWorkerParam: {scope: base},
      notifyButton: {enable: false}
    });
    const btn = $('enable-notifications');
    const update = () => {btn.textContent = OneSignal.Notifications.permission ? 'Notifications enabled ✓' : 'Enable notifications';};
    update();
    btn.addEventListener('click', async () => {
      try {await OneSignal.Notifications.requestPermission();update();}
      catch (err) {setError('Notifications could not be enabled: ' + err.message);}
    });
  } catch(err) {
    console.warn('OneSignal setup:',err);
    $('enable-notifications').textContent='Notifications unavailable';
  }
});
refresh();setInterval(()=>{if(!document.hidden)refresh()},1800);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
